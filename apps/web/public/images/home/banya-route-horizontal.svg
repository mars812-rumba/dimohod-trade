<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Горизонтальный маршрут дымохода через стену</title>
  <desc id="desc">Схематичный маршрут от отопителя через стену к наружному тройнику и вертикальной сэндвич-трубе</desc>
  <defs>
    <linearGradient id="pipe" x1="0" x2="1">
      <stop offset="0" stop-color="#86979c"/>
      <stop offset="0.2" stop-color="#f7faf9"/>
      <stop offset="0.48" stop-color="#acb9bc"/>
      <stop offset="0.72" stop-color="#f5f8f7"/>
      <stop offset="1" stop-color="#77898e"/>
    </linearGradient>
    <linearGradient id="single" x1="0" x2="1">
      <stop offset="0" stop-color="#747f82"/>
      <stop offset="0.35" stop-color="#e8edec"/>
      <stop offset="0.72" stop-color="#9da8aa"/>
      <stop offset="1" stop-color="#606c70"/>
    </linearGradient>
    <pattern id="wood" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#d8b884"/>
      <path d="M0 4h18M0 13h18" stroke="#b79058" stroke-width="1" opacity=".65"/>
      <path d="M4 0v18M14 0v18" stroke="#ead2a9" stroke-width="1" opacity=".5"/>
    </pattern>
    <pattern id="insulation" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#d8b648"/>
      <path d="M-2 10L10-2M4 14L16 2" stroke="#9c7a20" stroke-width="2" opacity=".55"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#1e5264"/>
    </marker>
  </defs>

  <g id="sheet">
    <rect width="720" height="1080" fill="#f7f5f0"/>
    <rect x="28" y="28" width="664" height="1024" rx="20" fill="#fff" stroke="#cbd6d8" stroke-width="2"/>
    <text x="64" y="82" fill="#113d4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700">Горизонтальный маршрут</text>
    <text x="64" y="116" fill="#60747a" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">Подключение заднего патрубка через стену</text>
  </g>

  <g id="building">
    <path d="M390 245L660 135v815H390z" fill="#f1e1c8" stroke="#785c3f" stroke-width="4"/>
    <path d="M370 250L657 128l12 25-287 122z" fill="#8d5d3d" stroke="#65412b" stroke-width="3"/>
    <rect x="390" y="245" width="36" height="705" fill="url(#wood)" stroke="#785c3f" stroke-width="3"/>
    <rect x="426" y="245" width="26" height="705" fill="#efe4d2"/>
    <rect x="452" y="245" width="34" height="705" fill="url(#wood)" stroke="#785c3f" stroke-width="3"/>
    <rect x="486" y="245" width="174" height="705" fill="#f4e7d4"/>
    <rect x="390" y="928" width="270" height="22" fill="#aa754b" stroke="#785c3f" stroke-width="3"/>
  </g>

  <g id="outside-sandwich" stroke="#40565d" stroke-width="3">
    <rect x="184" y="204" width="92" height="505" rx="8" fill="url(#pipe)"/>
    <path d="M175 204h110l-18-28h-74z" fill="#71858a"/>
    <path d="M190 176l40-40 40 40z" fill="#8b9a9e"/>
    <path d="M230 136v-20" stroke="#40565d" stroke-width="5"/>
    <g fill="#61757a">
      <rect x="179" y="262" width="102" height="16" rx="5"/>
      <rect x="179" y="482" width="102" height="16" rx="5"/>
    </g>
    <path d="M178 330h104l18 13v22H160v-22z" fill="#73888e"/>
    <path d="M160 349H94" fill="none"/>
    <path d="M98 330h62v38H98z" fill="#65797f"/>
    <path d="M98 349H72" fill="none" stroke-width="8"/>
  </g>

  <g id="tee-and-support" stroke="#40565d" stroke-width="3">
    <rect x="184" y="692" width="92" height="136" rx="7" fill="url(#pipe)"/>
    <path d="M276 716h64l35 32-35 32h-64z" fill="url(#pipe)"/>
    <rect x="218" y="818" width="24" height="58" rx="5" fill="url(#single)"/>
    <path d="M195 876h70l-12 24h-46z" fill="#71858a"/>
    <path d="M165 907h130l-18 25h-94z" fill="#65797f"/>
    <path d="M164 910L92 978h72z" fill="#9ba9ac"/>
    <path d="M164 910h131l-18 22H164z" fill="#75878b"/>
    <circle cx="123" cy="948" r="5" fill="#fff"/>
    <circle cx="151" cy="923" r="5" fill="#fff"/>
  </g>

  <g id="wall-passage" stroke="#40565d" stroke-width="3">
    <rect x="340" y="721" width="195" height="54" rx="10" fill="url(#pipe)"/>
    <rect x="378" y="701" width="112" height="94" fill="url(#insulation)" stroke="#8c7329"/>
    <rect x="365" y="713" width="138" height="70" rx="5" fill="none" stroke="#596c70" stroke-width="5"/>
    <rect x="356" y="707" width="14" height="82" rx="5" fill="#9aa8ab"/>
    <rect x="498" y="707" width="14" height="82" rx="5" fill="#9aa8ab"/>
    <line x1="308" y1="748" x2="548" y2="748" stroke="#49636c" stroke-width="1.5" stroke-dasharray="12 6 2 6"/>
  </g>

  <g id="indoor-connection" stroke="#3f5156" stroke-width="3">
    <rect x="512" y="726" width="80" height="44" rx="7" fill="url(#single)"/>
    <rect x="548" y="718" width="15" height="60" rx="5" fill="#65777b"/>
    <circle cx="555.5" cy="714" r="7" fill="#ed632f" stroke="#91371c"/>
    <line x1="555" y1="714" x2="575" y2="695" stroke="#91371c" stroke-width="5"/>
    <rect x="579" y="749" width="32" height="64" rx="7" fill="url(#single)" transform="rotate(90 595 781)"/>
  </g>

  <g id="heater">
    <rect x="548" y="792" width="103" height="155" rx="9" fill="#26343a" stroke="#10272f" stroke-width="4"/>
    <rect x="562" y="820" width="75" height="84" rx="5" fill="#0d1e24" stroke="#718085" stroke-width="3"/>
    <path d="M590 889c-20-26 5-37 2-60 24 20 24 36 11 57 12-10 18-21 17-36 17 22 5 45-11 54-18 10-36 0-40-12 8 3 14 1 21-3z" fill="#ed632f"/>
    <rect x="566" y="914" width="68" height="10" rx="3" fill="#738187"/>
    <path d="M562 947l-8 21M637 947l8 21" stroke="#26343a" stroke-width="8"/>
  </g>

  <g id="callouts" fill="none" stroke="#1e5264" stroke-width="2" marker-end="url(#arrow)">
    <path d="M82 270h92"/>
    <path d="M82 662h96"/>
    <path d="M150 850l28-66"/>
    <path d="M560 630l-45 80"/>
    <path d="M590 680l-18 40"/>
  </g>
  <g id="labels" fill="#173f4d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">
    <text x="66" y="226" font-weight="700">Наружная</text>
    <text x="66" y="247">сэндвич-труба</text>
    <text x="66" y="620" font-weight="700">Силовой хомут</text>
    <text x="66" y="641">и консоль</text>
    <text x="66" y="812" font-weight="700">Тройник</text>
    <text x="66" y="833">с нижней опорой</text>
    <text x="500" y="598" font-size="14" font-weight="700">Проход через стену</text>
    <text x="500" y="618" font-size="13">Негорючее заполнение</text>
    <text x="500" y="650" font-size="14" font-weight="700">Одноконтурная труба</text>
    <text x="500" y="670" font-size="14">От заднего патрубка</text>
  </g>

  <g id="footer">
    <rect x="64" y="996" width="592" height="34" rx="8" fill="#e8eff0"/>
    <text x="360" y="1019" text-anchor="middle" fill="#496068" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">СХЕМАТИЧНО · БЕЗ МАСШТАБА · НЕ МОНТАЖНЫЙ ЧЕРТЁЖ</text>
  </g>
</svg>
