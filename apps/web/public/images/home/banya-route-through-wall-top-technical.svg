<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="315mm" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
  <title id="title">Горизонтальное подключение дымохода через стену</title>
  <desc id="desc">Техническая схема от верхнего патрубка отопителя через одноконтурный отвод и стеновой проход к наружному сэндвич-тройнику, опоре, вертикальным трубам и оголовку</desc>
  <defs>
    <linearGradient id="steel-v" x1="0" x2="1">
      <stop offset="0" stop-color="#667176"/><stop offset=".16" stop-color="#c7ced0"/>
      <stop offset=".38" stop-color="#f7f8f7"/><stop offset=".62" stop-color="#aeb8ba"/>
      <stop offset=".82" stop-color="#eef1f0"/><stop offset="1" stop-color="#5b666a"/>
    </linearGradient>
    <linearGradient id="steel-h" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#667176"/><stop offset=".2" stop-color="#dfe4e3"/>
      <stop offset=".48" stop-color="#fafbfa"/><stop offset=".78" stop-color="#a2adaf"/>
      <stop offset="1" stop-color="#566166"/>
    </linearGradient>
    <pattern id="insulation" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e1c45a"/>
      <path d="M-4 12L12-4M3 17L19 1" stroke="#94741c" stroke-width="2" opacity=".58"/>
    </pattern>
    <pattern id="wall-fill" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#e6d2b6"/>
      <path d="M0 6h24M0 18h24" stroke="#c3a57b" stroke-width="1.2" opacity=".7"/>
      <path d="M7 0v24M19 0v24" stroke="#f1e3cf" stroke-width="1" opacity=".65"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#1f6074"/>
    </marker>
    <style>
      .t{font-family:"DejaVu Sans",Arial,sans-serif;fill:#173f4d}.h{font-weight:700}.small{font-size:16px}.label{font-size:18px}
      .leader{fill:none;stroke:#1f6074;stroke-width:2.2;marker-end:url(#arrow)}
      .outline{stroke:#33464d;stroke-width:3}.center{stroke:#55717a;stroke-width:1.6;stroke-dasharray:12 6 2 6}
      .num{font-family:"DejaVu Sans",Arial,sans-serif;font-size:17px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>

  <g id="sheet">
    <rect width="1024" height="1536" fill="#f4f6f4"/>
    <rect x="24" y="24" width="976" height="1488" rx="26" fill="#fff" stroke="#c9d4d6" stroke-width="2"/>
    <text class="t h" x="55" y="76" font-size="31">Дымоход через стену · верхний выход</text>
    <text class="t" x="55" y="108" font-size="17" fill="#61767d">Состав узлов синхронизирован со сметой конфигуратора</text>
    <path d="M55 130H969" stroke="#d3dcde" stroke-width="2"/>
  </g>

  <g id="building">
    <path d="M505 292L805 178v1040H505z" fill="#f2e7d8" stroke="#84694e" stroke-width="4"/>
    <path d="M480 300L800 170l16 31-322 130z" fill="#855a3c" stroke="#60402d" stroke-width="4"/>
    <rect x="505" y="292" width="52" height="926" fill="url(#wall-fill)" stroke="#84694e" stroke-width="3"/>
    <rect x="557" y="292" width="44" height="926" fill="#eee4d7" stroke="#c5b39d" stroke-width="2"/>
    <rect x="601" y="292" width="204" height="926" fill="#f5eee4"/>
    <path d="M505 1218h300" stroke="#84694e" stroke-width="7"/>
    <text class="t small" x="514" y="340">СТЕНА</text>
    <text class="t small" x="674" y="336">ФАСАД</text>
  </g>

  <g id="heater-and-mono-start">
    <rect x="72" y="1192" width="175" height="188" rx="14" fill="#26373e" stroke="#10262e" stroke-width="5"/>
    <rect x="94" y="1220" width="131" height="104" rx="8" fill="#102329" stroke="#7c8b8f" stroke-width="3"/>
    <path d="M147 1305c-26-28 7-45 2-72 35 23 32 45 18 65 17-11 25-24 24-42 23 26 6 55-18 64-27 10-55-3-57-19 10 6 20 6 31 4z" fill="#ee6a34"/>
    <path d="M92 1380l-10 30M226 1380l10 30" stroke="#26373e" stroke-width="12"/>
    <rect x="145" y="1120" width="36" height="72" rx="7" fill="url(#steel-v)" class="outline"/>
    <rect x="136" y="1112" width="54" height="17" rx="5" fill="#6c7b80" class="outline"/>
    <path d="M145 1122v-12a55 55 0 0155-55h58v62h-43a34 34 0 00-34 34v-29z" fill="url(#steel-v)" class="outline"/>
    <path d="M162 1110a38 38 0 0138-38h58" fill="none" stroke="#f7f8f7" stroke-width="3" opacity=".75"/>
    <line class="center" x1="163" y1="1192" x2="163" y2="1087"/>
  </g>

  <g id="mono-to-sandwich-transition">
    <path d="M251 1058h55l20 13v34l-20 13h-55z" fill="url(#steel-h)" class="outline"/>
    <rect x="300" y="1052" width="22" height="72" rx="5" fill="#7d8c90" class="outline"/>
    <path d="M322 1047h30v82h-30l-13-12v-58z" fill="url(#steel-h)" class="outline"/>
  </g>

  <g id="wall-passage">
    <rect x="454" y="1020" width="174" height="138" rx="7" fill="url(#insulation)" stroke="#8e7423" stroke-width="3"/>
    <rect x="438" y="1036" width="206" height="106" rx="7" fill="none" stroke="#617379" stroke-width="7"/>
    <rect x="428" y="1029" width="18" height="120" rx="5" fill="#9ca8ab" class="outline"/>
    <rect x="636" y="1029" width="18" height="120" rx="5" fill="#9ca8ab" class="outline"/>
    <line class="center" x1="408" y1="1089" x2="666" y2="1089"/>
  </g>

  <g id="tee-and-support">
    <path d="M656 1028h74v24l22 15v60l-22 15v31h-74z" fill="url(#steel-v)" class="outline"/>
    <path d="M656 1058h-30l-20 14v62l20 14h30z" fill="url(#steel-h)" class="outline"/>
    <path d="M666 1173h54l-8 36h-38z" fill="#738288" class="outline"/>
    <rect x="680" y="1206" width="26" height="66" rx="5" fill="url(#steel-v)" class="outline"/>
    <path d="M674 1272h38l-8 24h-22z" fill="#596a70" class="outline"/>
    <rect x="633" y="1165" width="120" height="22" rx="4" fill="#66777c" class="outline"/>
    <path d="M632 1187H548v88z" fill="#a9b4b6" class="outline"/>
    <path d="M753 1187H669v88z" fill="#a9b4b6" class="outline"/>
    <path d="M633 1187l-69 68M737 1187l-54 68" fill="none" stroke="#66777c" stroke-width="6"/>
    <circle cx="565" cy="1255" r="6" fill="#fff" stroke="#526269" stroke-width="3"/>
    <circle cx="685" cy="1255" r="6" fill="#fff" stroke="#526269" stroke-width="3"/>
  </g>

  <g id="dynamic-stack-reference">
    <path d="M659 238h68v790h-68z" fill="#f7faf9" opacity=".18"/>
    <path d="M645 238h96l-14-23h-68z" fill="#718287" class="outline"/>
    <path d="M658 215l35-35 35 35z" fill="url(#steel-v)" class="outline"/>
    <path d="M693 180v-21" stroke="#33464d" stroke-width="5"/>
  </g>

  <g id="fixed-callouts">
    <g><circle cx="163" cy="1180" r="15" fill="#1f6074"/><text class="num" x="163" y="1180">1</text></g>
    <path class="leader" d="M54 1167h78l17 7"/><text class="t label h" x="54" y="1140">Патрубок</text>

    <g><circle cx="163" cy="1143" r="15" fill="#1f6074"/><text class="num" x="163" y="1143">2</text></g>
    <path class="leader" d="M54 1050h75l22 75"/><text class="t label h" x="54" y="1016">Стартовая труба</text><text class="t small" x="54" y="1038">одноконтурная</text>

    <g><circle cx="211" cy="1085" r="15" fill="#1f6074"/><text class="num" x="211" y="1085">3</text></g>
    <path class="leader" d="M54 940h105l40 127"/><text class="t label h" x="54" y="906">Отвод 90°</text><text class="t small" x="54" y="928">одноконтурный</text>

    <g><circle cx="328" cy="1088" r="15" fill="#1f6074"/><text class="num" x="328" y="1088">4</text></g>
    <path class="leader" d="M54 820h222l43 248"/><text class="t label h" x="54" y="782">Переход на сэндвич</text><text class="t small" x="54" y="804">сэндвич-заглушка</text>

    <g><circle cx="397" cy="1028" r="15" fill="#1f6074"/><text class="num" x="397" y="1028">5</text></g>
    <path class="leader" d="M54 684h280l58 323"/><text class="t label h" x="54" y="646">Сэндвич-трубы</text><text class="t small" x="54" y="668">количество — из конфигуратора</text>

    <g><circle cx="542" cy="1000" r="15" fill="#1f6074"/><text class="num" x="542" y="1000">6</text></g>
    <path class="leader" d="M970 914H812l-249 73"/><text class="t label h" x="774" y="862">Проход стены</text><text class="t small" x="774" y="886">вата · стакан</text><text class="t small" x="774" y="908">хомут прохода</text>

    <g><circle cx="693" cy="1097" r="15" fill="#1f6074"/><text class="num" x="693" y="1097">7</text></g>
    <path class="leader" d="M970 1032H801l-92 53"/><text class="t label h" x="775" y="980">Сэндвич-тройник</text><text class="t small" x="775" y="1004">90° с К/О</text>

    <g><circle cx="693" cy="1254" r="15" fill="#1f6074"/><text class="num" x="693" y="1254">8</text></g>
    <path class="leader" d="M970 1324H812l-103-56"/><text class="t label h" x="775" y="1287">Конденсатоотвод</text>

    <g><circle cx="636" cy="1194" r="15" fill="#1f6074"/><text class="num" x="636" y="1194">9</text></g>
    <path class="leader" d="M280 1402h171l168-198"/><text class="t label h" x="280" y="1360">Опорная площадка</text><text class="t small" x="280" y="1384">+ 2 универсальные консоли</text>

    <g><circle cx="755" cy="650" r="15" fill="#1f6074"/><text class="num" x="755" y="650">10</text></g>
    <path class="leader" d="M970 622H820l-48 19"/><text class="t label h" x="760" y="530">Консоль</text><text class="t label h" x="760" y="553">+ силовой хомут</text><text class="t small" x="760" y="579">шаг и край — по правилу</text><text class="t small" x="760" y="601">конфигуратора</text>

    <g><circle cx="693" cy="205" r="15" fill="#1f6074"/><text class="num" x="693" y="205">11</text></g>
    <path class="leader" d="M970 226H820l-110-18"/><text class="t label h" x="829" y="199">Оголовок</text>
  </g>

  <g id="title-block">
    <rect x="55" y="1431" width="914" height="54" rx="10" fill="#e7eff0" stroke="#c4d1d3" stroke-width="2"/>
    <text class="t h" x="512" y="1455" text-anchor="middle" font-size="15">СХЕМАТИЧНО · БЕЗ МАСШТАБА · НЕ МОНТАЖНЫЙ ЧЕРТЁЖ</text>
    <text class="t" x="512" y="1477" text-anchor="middle" font-size="13">Состав и крепление подтверждаются по выбранной системе дымохода и объекту.</text>
  </g>
</svg>
