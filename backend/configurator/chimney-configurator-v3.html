<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Конфигуратор дымохода</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Mono','JetBrains Mono',ui-monospace,monospace; background:#16181c; color:#dfe3e8; }
  .header { display:flex; justify-content:space-between; align-items:flex-end; padding:24px 28px; border-bottom:1px solid #2a2f38; }
  .kicker { font-size:11px; letter-spacing:.12em; color:#5fb8ff; margin-bottom:8px; }
  .title { font-size:20px; font-weight:600; color:#f2f4f7; }
  .count { font-size:34px; font-weight:700; color:#5fb8ff; line-height:1; text-align:right; }
  .count-label { font-size:10px; color:#8a8f98; text-align:right; }
  .body { display:flex; flex-wrap:wrap; }
  .controls { flex:1 1 340px; min-width:320px; padding:24px 28px; border-right:1px solid #2a2f38; }
  .field { margin-bottom:20px; }
  .field-label { font-size:11px; color:#8a8f98; margin-bottom:8px; letter-spacing:.03em; }
  .segmented { display:flex; gap:6px; }
  .segmented button { flex:1; background:#1e2126; border:1px solid #2a2f38; color:#9ba1aa; padding:9px 6px; font-size:11px; font-family:inherit; cursor:pointer; border-radius:3px; }
  .segmented button.active { background:#20344a; border-color:#5fb8ff; color:#bfe0ff; }
  input[type=range] { width:100%; accent-color:#5fb8ff; }
  .ticks { display:flex; justify-content:space-between; font-size:10px; color:#6b7078; margin-top:4px; }
  .spec-table { margin-top:24px; border-top:1px solid #2a2f38; padding-top:16px; }
  .spec-head { font-size:11px; color:#8a8f98; margin-bottom:10px; }
  .spec-row { display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid #21242a; }
  .spec-dot { width:6px; height:6px; border-radius:50%; background:#5fb8ff; margin-top:5px; flex-shrink:0; }
  .spec-text { flex:1; }
  .spec-label { font-size:12px; color:#e2e5ea; }
  .spec-note { font-size:10px; color:#6b7078; margin-top:2px; }
  .spec-qty { font-size:12px; color:#5fb8ff; font-weight:600; }
  .schematic-pane { flex:1 1 320px; min-width:320px; padding:24px 28px; display:flex; flex-direction:column; align-items:center; }
  .schematic-label { font-size:11px; color:#8a8f98; letter-spacing:.08em; align-self:flex-start; margin-bottom:12px; }
  .sheet-wrap { width:100%; border:1px solid #2a2f38; background:#f3efe4; overflow:auto; }
  .height-badge { margin-top:12px; font-size:11px; color:#8a8f98; text-align:center; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="kicker">КОНФИГУРАТОР · ТРАКТ ДЫМОХОДА</div>
    <div class="title">Внутренний и наружный монтаж</div>
  </div>
  <div><div class="count" id="count">0</div><div class="count-label">деталей<br>в комплекте</div></div>
</div>

<div class="body">
  <div class="controls">
    <div class="field"><div class="field-label">Маршрут</div><div class="segmented" id="seg-route"></div></div>
    <div class="field"><div class="field-label">Источник</div><div class="segmented" id="seg-stove"></div></div>

    <div class="field" id="field-outlet"><div class="field-label">Вывод из печки</div><div class="segmented" id="seg-outlet"></div></div>
    <div class="field" id="field-distance">
      <div class="field-label" id="label-distance">Удалённость от стены: 1.5 м</div>
      <input type="range" id="distance" min="0.5" max="3" step="0.5" value="1.5">
      <div class="ticks"><span>0.5м</span><span>3м</span></div>
    </div>

    <div class="field" id="field-floors"><div class="field-label">Этажность</div><div class="segmented" id="seg-floors"></div></div>
    <div class="field" id="field-roof"><div class="field-label">Кровля</div><div class="segmented" id="seg-roof"></div></div>

    <div class="field">
      <div class="field-label" id="label-height">Высота: 5.0 м</div>
      <input type="range" id="height" min="3" max="9" step="0.5" value="5">
      <div class="ticks"><span>3м</span><span>9м</span></div>
    </div>

    <div class="spec-table"><div class="spec-head">Спецификация</div><div id="spec-list"></div></div>
  </div>

  <div class="schematic-pane">
    <div class="schematic-label" id="scheme-label">СХЕМА</div>
    <div class="sheet-wrap"><svg id="svg" width="100%"></svg></div>
    <div class="height-badge" id="height-badge"></div>
  </div>
</div>

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function img(name, x, y, w, h) {

function pushBom(bom, type, qty) {
  const cur = bom.find(b => b.type === type);
  if (cur) cur.qty += qty; else bom.push({ type, qty });
}

function segments(lengthM) {
  const n1 = Math.floor(lengthM);
  const half = (lengthM - n1) >= 0.4 ? 1 : 0;
  return { n1, half };
}

  bg.push({ t: "rect", x: 14, y: atticTop, w: V_W - 28, h: Math.max(0, roomTop - atticTop - 2), fill: "none", stroke: "#8a8272", dash: "3,3" });
  bg.push({ t: "rect", x: 0, y: roomTop, w: V_W, h: groundY - roomTop, fill: "#dcd6c4", opacity: 0.55 });
  bg.push({ t: "line", x1: 8, y1: groundY, x2: V_W - 8, y2: groundY, stroke: "#8a8272", dash: "3,3" });
  bg.push({ t: "rect", x: cx - 22, y: groundY - 30, w: 44, h: 30, fill: "none", stroke: "#b5602f" });
  ceilingParts.forEach((p, idx) => {
    bg.push({ t: "label", x: 10, y: p.y - 4, text: (idx === 0 ? "ПЕРЕКРЫТИЕ" : "ПЕРЕКРЫТИЕ " + (idx + 1)) });
  });
  bg.push({ t: "label", x: 10, y: atticTop + 14, text: "ЧЕРДАК" });
  bg.push({ t: "label", x: 10, y: 16, text: "НАД КРОВЛЕЙ" });
  bg.push({ t: "label", x: 10, y: groundY - 8, text: "ПОМЕЩЕНИЕ" });

  return { svgW: V_W, svgH: totalH, viewBox: `0 0 ${V_W} ${totalH}`, images: placed, bg, bom,
    badge: `${s.heightM.toFixed(1)} м от печи до оголовка · ${s.floors} эт.` };
}

function buildWallScene(s) {
  const bom = [];
  const images = [];

  const GROUND_Y = 260;
  const STOVE_X = 90;
  const HORIZ_Y_FIXED = GROUND_Y - 90;

  let horizY, rowStartX;

  if (s.outlet === "vertical") {
    pushBom(bom, "start_cap", 1);
    if (s.stove === "kamin") pushBom(bom, "tee", 1);
    pushBom(bom, "elbow", 1);

    let cursor = GROUND_Y - 30;
    const stack = ["start_cap"];
    if (s.stove === "kamin") stack.push("tee");
    stack.push("elbow_up_to_side");
    let lastImg = null;
    stack.forEach(a => {
      const isElbow = a === "elbow_up_to_side";
      const h = isElbow ? HORIZ.elbow_up_to_side : VERT[a];
      cursor -= h;
      const w = isElbow ? HORIZ.elbow_up_to_side : V_W;
      const x = isElbow ? STOVE_X - w / 2 : STOVE_X - V_W / 2;
      lastImg = { asset: a, x, y: cursor, w, h };
      images.push(lastImg);
    });
    horizY = lastImg.y + lastImg.h / 2;
    rowStartX = lastImg.x + lastImg.w;
  } else {
    pushBom(bom, "start_cap", 1);
    horizY = HORIZ_Y_FIXED;
    rowStartX = STOVE_X;
    images.push({ asset: "start_cap_h", x: rowStartX, y: horizY - H_H / 2, w: HORIZ.start_cap_h, h: H_H });
    rowStartX += HORIZ.start_cap_h;
  }

  pushBom(bom, "adapter", 1);
  const rowAssets = ["adapter_h"];
  const { n1, half } = segments(s.distanceM);
  for (let i = 0; i < n1; i++) { rowAssets.push("pipe_h"); pushBom(bom, "pipe", 1); }
  if (half) { rowAssets.push("pipe_short_h"); pushBom(bom, "pipe_short", 1); }
  rowAssets.push("wall_passage_h"); pushBom(bom, "wall_passage", 1);

  let cx = rowStartX;
  const rowY = horizY - H_H / 2;
  let wallX = null;
  rowAssets.forEach(a => {
    const w = HORIZ[a];
    images.push({ asset: a, x: cx, y: rowY, w, h: H_H });
    if (a === "wall_passage_h") wallX = cx + w / 2;
    cx += w;
  });
  const rowEndX = cx;

  pushBom(bom, "elbow", 1);
  const esuH = VERT.elbow_side_to_up;
  const esuX = rowEndX;
  const esuY = horizY - esuH / 2;
  images.push({ asset: "elbow_side_to_up", x: esuX, y: esuY, w: 200, h: esuH });
  const exteriorX = esuX + 100;

  const vertOrder = [];
  const { n1: vn1, half: vhalf } = segments(s.heightM);
  for (let i = 0; i < vn1; i++) {
    vertOrder.push("pipe"); pushBom(bom, "pipe", 1);
    if ((i + 1) % 2 === 0) { vertOrder.push("wall_bracket"); pushBom(bom, "wall_bracket", 1); }
  }
  if (vhalf) { vertOrder.push("pipe_short"); pushBom(bom, "pipe_short", 1); }
  vertOrder.push("wall_bracket"); pushBom(bom, "wall_bracket", 1);
  vertOrder.push("cap"); pushBom(bom, "cap", 1);

  let cursor2 = esuY;
  vertOrder.forEach(a => {
    const h = VERT[a];
    cursor2 -= h;
    images.push({ asset: a, x: exteriorX - V_W / 2, y: cursor2, w: V_W, h });
  });
  const topY = cursor2;

  const svgW = exteriorX + V_W / 2 + 20;
  const marginTop = 24;
  const canvasTop = Math.min(marginTop, topY - 20);
  const svgH = GROUND_Y + 40 - canvasTop;

  const roomTopY = horizY - 34;
  const eaveX = wallX + 16;

  const bg = [];
  bg.push({ t: "rect", x: wallX, y: canvasTop, w: svgW - wallX, h: GROUND_Y - canvasTop, fill: "#e9e4d6", opacity: 0.45 });
  bg.push({ t: "rect", x: 20, y: roomTopY, w: wallX - 28, h: GROUND_Y - roomTopY, fill: "#dcd6c4", opacity: 0.6 });
  bg.push({ t: "path", d: `M 8 ${roomTopY} L ${eaveX} ${roomTopY} L ${(20 + wallX - 8) / 2} ${roomTopY - 30} L 8 ${roomTopY - 2} Z`, fill: "#c9a877", stroke: "#8a6a3a" });
  bg.push({ t: "rect", x: 0, y: GROUND_Y, w: svgW, h: svgH - (GROUND_Y - canvasTop), fill: "#cfc4ab", opacity: 0.5 });
  bg.push({ t: "line", x1: 6, y1: GROUND_Y, x2: svgW - 6, y2: GROUND_Y, stroke: "#8a8272", dash: "3,3" });
  bg.push({ t: "rect", x: wallX - 8, y: roomTopY - 34, w: 16, h: GROUND_Y - (roomTopY - 34), fill: "#cbb385", stroke: "#8a6a3a" });
  bg.push({ t: "rect", x: STOVE_X - 20, y: GROUND_Y - 30, w: 40, h: 30, fill: "none", stroke: "#b5602f" });
  bg.push({ t: "label", x: 26, y: GROUND_Y - 8, text: "ПОМЕЩЕНИЕ" });
  bg.push({ t: "label", x: exteriorX - 10, y: canvasTop + 14, text: "НАРУЖНАЯ ЧАСТЬ", anchor: "middle" });

  return { svgW, svgH, viewBox: `0 ${canvasTop} ${svgW} ${svgH}`, images, bg, bom,
    badge: `${s.distanceM.toFixed(1)} м от печи до стены · ${s.heightM.toFixed(1)} м наружного участка` };
}

function renderScene(scene) {
  const svg = document.getElementById("svg");
  svg.innerHTML = "";
  svg.setAttribute("viewBox", scene.viewBox);
  svg.style.height = Math.min(560, scene.svgH * 1.4) + "px";
  svg.style.display = "block";
  svg.style.margin = "0 auto";

  const vbParts = scene.viewBox.split(" ");
  const bgRect = el("rect", { x: vbParts[0], y: vbParts[1], width: scene.svgW, height: scene.svgH, fill: "#f3efe4" });
  svg.appendChild(bgRect);

  scene.bg.forEach(b => {
    if (b.t === "rect") {
      svg.appendChild(el("rect", { x: b.x, y: b.y, width: b.w, height: Math.max(0,b.h), fill: b.fill, stroke: b.stroke || "none",
        "stroke-dasharray": b.dash || "none", opacity: b.opacity !== undefined ? b.opacity : 1 }));
    } else if (b.t === "line") {
      svg.appendChild(el("line", { x1: b.x1, y1: b.y1, x2: b.x2, y2: b.y2, stroke: b.stroke, "stroke-dasharray": b.dash || "none" }));
    } else if (b.t === "path") {
      svg.appendChild(el("path", { d: b.d, fill: b.fill, stroke: b.stroke }));
    } else if (b.t === "label") {
      const t = el("text", { x: b.x, y: b.y, fill: "#7a715e", "font-size": 9, "letter-spacing": "0.05em", "text-anchor": b.anchor || "start" });
      t.style.fontFamily = "inherit";
      t.textContent = b.text;
      svg.appendChild(t);
    }
  });

  scene.images.forEach(p => svg.appendChild(img(p.asset, p.x, p.y, p.w, p.h)));
}

function segmented(container, options, current, onChange) {
  container.innerHTML = "";
  options.forEach(([id, label]) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (id === current) btn.classList.add("active");
    btn.onclick = () => onChange(id);
    container.appendChild(btn);
  });
}

function render() {
  const isCeiling = state.route === "ceiling";
  document.getElementById("field-outlet").style.display = isCeiling ? "none" : "block";
  document.getElementById("field-distance").style.display = isCeiling ? "none" : "block";
  document.getElementById("field-floors").style.display = isCeiling ? "block" : "none";
  document.getElementById("field-roof").style.display = isCeiling ? "block" : "none";
  document.getElementById("label-height").textContent = "Высота: " + state.heightM.toFixed(1) + " м" + (isCeiling ? "" : " (наружный участок)");
  document.getElementById("scheme-label").textContent = isCeiling ? "СХЕМА: ЧЕРЕЗ ПЕРЕКРЫТИЕ И КРОВЛЮ" : "СХЕМА: НАРУЖНЫЙ МОНТАЖ ПО СТЕНЕ";

  const scene = isCeiling ? buildCeilingScene(state) : buildWallScene(state);
  renderScene(scene);

  const totalQty = scene.bom.reduce((s, b) => s + b.qty, 0);
  document.getElementById("count").textContent = totalQty;
  document.getElementById("height-badge").textContent = scene.badge;

  const list = document.getElementById("spec-list");
  list.innerHTML = "";
  scene.bom.forEach(b => {
    const [label, note] = BOM_LABELS[b.type];
    const row = document.createElement("div");
    row.className = "spec-row";
    row.innerHTML = `<span class="spec-dot"></span><div class="spec-text"><div class="spec-label">${label}</div><div class="spec-note">${note}</div></div><div class="spec-qty">×${b.qty}</div>`;
    list.appendChild(row);
  });

  segmented(document.getElementById("seg-route"), [["ceiling","Через дом"],["wall","По улице"]], state.route, v => { state.route = v; render(); });
  segmented(document.getElementById("seg-stove"), [["bania","Банная печь"],["kamin","Камин / котёл"]], state.stove, v => { state.stove = v; render(); });
  segmented(document.getElementById("seg-outlet"), [["vertical","Вертикальный"],["horizontal","Горизонтальный"]], state.outlet, v => { state.outlet = v; render(); });
  segmented(document.getElementById("seg-floors"), [["1","1 этаж"],["2","2 этажа"],["3","3 этажа"]], String(state.floors), v => { state.floors = parseInt(v); render(); });
  segmented(document.getElementById("seg-roof"), [["pitched","Скатная"],["flat","Плоская"]], state.roof, v => { state.roof = v; render(); });
}

document.getElementById("distance").addEventListener("input", e => { state.distanceM = parseFloat(e.target.value); document.getElementById("label-distance").textContent = "Удалённость от стены: " + state.distanceM.toFixed(1) + " м"; render(); });
document.getElementById("height").addEventListener("input", e => { state.heightM = parseFloat(e.target.value); render(); });

render();
</script>
