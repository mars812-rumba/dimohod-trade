[project]
name = "dimohod-trade-backend"
version = "0.1.0"
description = "FastAPI backend for Dimohod Trade chimney platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "pillow>=11.0.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
