services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chimney}
      POSTGRES_USER: ${POSTGRES_USER:-chimney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chimney}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://chimney:chimney@postgres:5432/chimney}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/app/storage}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SEO_MODEL: ${OPENAI_SEO_MODEL:-gpt-5.6-luna}
      YANDEX_OAUTH_TOKEN: ${YANDEX_OAUTH_TOKEN:-${YANDEX_OAuth_Token:-}}
      YANDEX_WEBMASTER_TOKEN: ${YANDEX_WEBMASTER_TOKEN:-}
      YANDEX_WEBMASTER_HOST_URL: ${YANDEX_WEBMASTER_HOST_URL:-https://dimohod-trade.pro}
      YANDEX_METRIKA_TOKEN: ${YANDEX_METRIKA_TOKEN:-}
      YANDEX_METRIKA_COUNTER_ID: ${YANDEX_METRIKA_COUNTER_ID:-112091795}
      YANDEX_WORDSTAT_TOKEN: ${YANDEX_WORDSTAT_TOKEN:-}
      LEAD_RECIPIENT_EMAIL: ${LEAD_RECIPIENT_EMAIL:-office@dimohod-trade.pro}
      LEAD_FROM_EMAIL: ${LEAD_FROM_EMAIL:-office@dimohod-trade.pro}
      LEAD_MANAGER_BASE_URL: ${LEAD_MANAGER_BASE_URL:-https://dimohod-trade.pro/admin/estimates}
      SMTP_HOST: ${SMTP_HOST:-smtp.beget.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-${LEAD_FROM_EMAIL:-office@dimohod-trade.pro}}
      SMTP_PASSWORD: ${MAIL_PASS:-${SMTP_PASSWORD:-}}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      BOM_ADMIN_TOKEN: ${BOM_ADMIN_TOKEN:-}
      ADMIN_SESSION_COOKIE_SECURE: ${ADMIN_SESSION_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/configurator:/app/configurator:ro
      - ./backend/tests:/app/tests
      - ./storage:/app/storage

  web:
    build:
      context: ./apps/web
      args:
        API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
        NEXT_BASE_PATH: ${NEXT_BASE_PATH-/dimohod}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_BASE_PATH-/dimohod}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_BASE_PATH-/dimohod}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://sunny-rentals.online/dimohod}
      NEXT_BASE_PATH: ${NEXT_BASE_PATH-/dimohod}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
