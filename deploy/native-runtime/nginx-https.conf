server {
    listen 80;
    server_name dimohod-trade.pro www.dimohod-trade.pro;
    location ^~ /.well-known/acme-challenge/ {
        root /home/dimohod-production-runtime/acme;
        try_files $uri =404;
    }
    location / { return 301 https://dimohod-trade.pro$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.dimohod-trade.pro;
    ssl_certificate /etc/letsencrypt/live/dimohod-trade.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dimohod-trade.pro/privkey.pem;
    return 301 https://dimohod-trade.pro$request_uri;
}
server {
    listen 443 ssl;
    server_name dimohod-trade.pro;
    ssl_certificate /etc/letsencrypt/live/dimohod-trade.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dimohod-trade.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 25m;
    access_log off;
    error_log /var/log/nginx/dimohod-public-error.log warn;
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
